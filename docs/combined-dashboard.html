<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gollemer Combined Dashboard</title>
  <style>
    html, body { height:100%; margin:0; background:#07111f; color:#f3f4f6; font-family:Inter,system-ui,Arial,sans-serif; }
    body { overflow:hidden; }
    .toolbar { position:fixed; left:8px; top:8px; z-index:999; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .btn { padding:6px 10px; border-radius:6px; background:#1f2937; color:#fff; border:1px solid #374151; cursor:pointer; }
    .pill { color:#ddd; padding:6px 10px; border-radius:999px; background:#0b1220; border:1px solid #22314a; }
    .page { height:100vh; padding:56px 8px 8px; display:flex; flex-direction:column; gap:8px; box-sizing:border-box; }
    .summary { display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:10px 12px; border:1px solid #22314a; border-radius:10px; background:linear-gradient(90deg,#111827,#0f172a); box-shadow:0 6px 20px rgba(0,0,0,.25); }
    .summary .chip { padding:6px 10px; border-radius:999px; background:#1f2937; border:1px solid #374151; font-size:13px; }
    .split { display:flex; flex:1; gap:8px; min-height:0; }
    .pane-card { flex:1; display:flex; flex-direction:column; min-height:0; border:1px solid #22314a; border-radius:12px; overflow:hidden; background:#0b1220; }
    .pane-title { padding:10px 14px; font-size:13px; font-weight:600; background:#111827; border-bottom:1px solid #22314a; color:#e5e7eb; }
    .host { flex:1; min-height:0; overflow:auto; background:transparent; }
    .host ::slotted(*) { box-sizing:border-box; }
    .host-loading { display:flex; align-items:center; justify-content:center; height:100%; color:#94a3b8; font-size:0.95rem; }
    @media(max-width:960px) { .split { flex-direction:column; } }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="btn" onclick="toggleLayout()">Toggle Layout</button>
    <span class="pill">Combined Dashboard • Classic + MoE Observability</span>
  </div>

  <div class="page">
    <div id="observability-summary" class="summary">Loading live observability…</div>
    <div id="container" class="split">
      <div class="pane-card">
        <div class="pane-title">Classic Dashboard</div>
        <div id="left-host" class="host"><div class="host-loading">Loading classic dashboard…</div></div>
      </div>
      <div class="pane-card">
        <div class="pane-title">MoE Observability</div>
        <div id="right-host" class="host"><div class="host-loading">Loading observability dashboard…</div></div>
      </div>
    </div>
  </div>

  <script>
    let vertical = true;
    function toggleLayout() {
      const c = document.getElementById('container');
      vertical = !vertical;
      c.style.flexDirection = vertical ? 'row' : 'column';
    }

    async function fetchText(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Failed to fetch ${url}: ${res.status}`);
      return await res.text();
    }

    async function mountPage(hostEl, url) {
      const html = await fetchText(url);
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');

      doc.head.querySelectorAll('link[rel="stylesheet"]').forEach(link => {
        const href = link.getAttribute('href');
        if (!href) return;
        if (Array.from(document.head.querySelectorAll('link')).some(existing => existing.href === new URL(href, location.href).href)) return;
        const clone = document.createElement('link');
        clone.rel = 'stylesheet';
        clone.href = href;
        document.head.appendChild(clone);
      });
      doc.head.querySelectorAll('style').forEach(style => {
        const clone = document.createElement('style');
        clone.textContent = style.textContent;
        document.head.appendChild(clone);
      });

      hostEl.innerHTML = '';
      const container = document.createElement('div');
      container.innerHTML = doc.body.innerHTML;
      hostEl.appendChild(container);

      const scripts = [];
      doc.querySelectorAll('script').forEach(script => {
        if (script.src) scripts.push({ src: script.src });
        else if (script.textContent && script.textContent.trim()) scripts.push({ inline: script.textContent });
      });

      return { container, scripts };
    }

    function dedupeBySrc(arr) {
      const seen = new Set();
      return arr.filter(item => {
        if (!item.src) return true;
        if (seen.has(item.src)) return false;
        seen.add(item.src);
        return true;
      });
    }

    async function loadExternalScriptsOrdered(srcs) {
      for (const src of srcs) {
        if (!src) continue;
        if (Array.from(document.scripts).some(s => s.src === src)) continue;
        await new Promise(resolve => {
          const s = document.createElement('script');
          s.src = src;
          s.async = false;
          s.onload = () => resolve();
          s.onerror = () => { console.warn('Failed load', src); resolve(); };
          document.head.appendChild(s);
        });
      }
    }

    async function runInlineScripts(inlines) {
      if (!inlines.length) return;
      for (const inline of inlines) {
        const script = document.createElement('script');
        script.textContent = inline;
        document.head.appendChild(script);
        document.head.removeChild(script);
      }
    }

    async function refreshSummary() {
      const el = document.getElementById('observability-summary');
      try {
        const res = await fetch('/api/metrics/current');
        if (!res.ok) throw new Error('metrics unavailable');
        const data = await res.json();
        const driftCount = Array.isArray(data.semantic_drift) ? data.semantic_drift.length : 0;
        const health = data.health_indicators || {};
        const epoch = data.epoch ?? '--';
        const learning = health.learning_intensity || 'N/A';
        const velocity = health.max_weight_velocity != null ? Number(health.max_weight_velocity).toFixed(4) : '--';
        el.innerHTML = `
          <span class="chip">Epoch ${epoch}</span>
          <span class="chip">Drift ${driftCount}</span>
          <span class="chip">Learning ${learning}</span>
          <span class="chip">Velocity ${velocity}</span>
          <span class="chip">Last update ${new Date().toLocaleTimeString()}</span>
        `;
      } catch (err) {
        el.innerHTML = '<span class="chip">Waiting for metrics…</span>';
      }
    }

    (async () => {
      try {
        const leftHost = document.getElementById('left-host');
        const rightHost = document.getElementById('right-host');
        const params = new URLSearchParams(window.location.search);
        params.set('embedded', '1');

        const left = await mountPage(leftHost, '/docs/dashboard.html' + window.location.search);
        const right = await mountPage(rightHost, '/docs/dashboard-enhanced.html?' + params.toString());

        const externals = dedupeBySrc(left.scripts.concat(right.scripts));
        const extSrcs = externals.filter(s => s.src).map(s => s.src);
        await loadExternalScriptsOrdered(extSrcs);

        await runInlineScripts(left.scripts.filter(s => s.inline).map(s => s.inline));
        await runInlineScripts(right.scripts.filter(s => s.inline).map(s => s.inline));

        refreshSummary();
        setInterval(refreshSummary, 1000);
      } catch (err) {
        console.error('Failed to mount combined dashboard', err);
        document.body.innerHTML = `<pre style="color:#fff;padding:16px;background:#800">Failed to load dashboard: ${err.message}</pre>`;
      }
    })();
  </script>
</body>
</html>
