{{ define "header" }}
<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- DNS prefetch and preconnect for external resources -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Preload critical resources -->
  <link rel="preload" href="/assets/style/style.css" as="style">
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" as="style">

  <!-- Critical CSS loaded synchronously -->
  <link rel="stylesheet" href="/assets/style/style.css">

  <!-- WASM loading - deferred to not block LCP -->
  <script defer src="/wasm/wasm_exec.js"></script>
  <script>
    // Load WASM asynchronously after page load
    window.addEventListener('DOMContentLoaded', function () {
      const go = new Go();
      WebAssembly.instantiateStreaming(fetch("/wasm/main.wasm?v=" + Date.now()), go.importObject).then((result) => {
        console.log("WASM Loaded successfully");
        go.run(result.instance);
      }).catch(err => console.error('WASM load failed:', err));
    });
  </script>
</head>

<body>
  {{ end }}
