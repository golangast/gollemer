<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jim Webserver - WASM</title>
    <link rel="stylesheet" href="assets/style/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #loading {
            font-size: 1.5rem;
            margin-bottom: 2rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #1e293b;
            border-top: 5px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>Loading Gollemer WASM...</p>
    </div>
    <div id="app-root"></div>

    <script src="wasm/wasm_exec.js"></script>
    <script>
        console.log("WASM Loader: Initializing...");
        if (!WebAssembly.instantiateStreaming) {
            console.log("WASM Loader: Using fallback instantiation...");
            WebAssembly.instantiateStreaming = async (resp, importObject) => {
                const source = await (await resp).arrayBuffer();
                return await WebAssembly.instantiate(source, importObject);
            };
        }

        const go = new Go();
        console.log("WASM Loader: Fetching main.wasm...");
        WebAssembly.instantiateStreaming(fetch("wasm/main.wasm"), go.importObject).then((result) => {
            console.log("WASM Loader: Successfully instantiated. Running Go main...");
            document.getElementById("loading").style.display = "none";
            go.run(result.instance);
        }).catch((err) => {
            console.error("WASM Loader: Failed to load WASM:", err);
            document.getElementById("loading").innerHTML = "<h1>Failed to load WASM</h1><p>" + err + "</p>";
        });
    </script>
</body>

</html>
